services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  mkcert:
    image: alpine/mkcert
    volumes:
      - certs:/certs
    entrypoint: >
      sh -c "mkcert -install &&
      mkcert -key-file /certs/key.pem -cert-file /certs/cert.pem localhost"
  app:
    image: astral/uv:0.9.2-python3.14-alpine
    depends_on:
      mkcert:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - certs:/certs:ro
    build: .
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --ssl-certfile /certs/cert.pem --ssl-keyfile /certs/key.pem
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db

volumes:
  postgres_data:
  certs:
